<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#f8f4ed">
  <title>Roomix 中国大陆上线前产品路演</title>
  <style>
    @font-face{font-family:Roomix Sans;src:url(data:font/woff2;base64,@@FONT_SANS@@) format('woff2');font-weight:100 900;font-display:swap}
    @font-face{font-family:Roomix Serif;src:url(data:font/woff2;base64,@@FONT_SERIF@@) format('woff2');font-weight:100 900;font-display:swap}
    @@STYLE@@
  </style>
</head>
<body>
  <svg width="0" height="0" aria-hidden="true" style="position:absolute">
    <defs>
      <symbol id="logo" viewBox="0 0 24 24"><path fill-rule="evenodd" d="M10.6 2.55a2.3 2.3 0 0 1 2.8 0l7.2 5.6c.56.44.9 1.12.9 1.83v9.27A2.75 2.75 0 0 1 18.75 22H5.25A2.75 2.75 0 0 1 2.5 19.25V9.98c0-.71.34-1.39.9-1.83l7.2-5.6ZM12 18.7c.2 0 4.6-2.7 4.6-5.8a2.45 2.45 0 0 0-4.6-1.2 2.45 2.45 0 0 0-4.6 1.2c0 3.1 4.4 5.8 4.6 5.8Z"/></symbol>
      <symbol id="arrow" viewBox="0 0 24 24"><path d="M5 12h14m-6-6 6 6-6 6" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></symbol>
      <symbol id="play" viewBox="0 0 24 24"><path d="m9 6 9 6-9 6Z" fill="currentColor"/></symbol>
      <symbol id="pause" viewBox="0 0 24 24"><path d="M8 6h3v12H8zm5 0h3v12h-3z" fill="currentColor"/></symbol>
      <symbol id="grid" viewBox="0 0 24 24"><path d="M5 5h5v5H5zm9 0h5v5h-5zM5 14h5v5H5zm9 0h5v5h-5z" fill="currentColor"/></symbol>
      <symbol id="full" viewBox="0 0 24 24"><path d="M8 4H4v4m12-4h4v4M4 16v4h4m12-4v4h-4" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></symbol>
      <symbol id="close" viewBox="0 0 24 24"><path d="m6 6 12 12M18 6 6 18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></symbol>
    </defs>
  </svg>
  <div id="viewport">
    <main class="deck" id="deck" aria-label="Roomix 产品路演">
      @@SLIDES@@
      <header class="deck-header" id="deck-header">
        <div class="brand"><span class="brand-mark"><svg viewBox="0 0 24 24" aria-hidden="true"><use href="#logo"/></svg></span>roomix</div>
        <span class="section-label" id="section-label"></span>
      </header>
      <footer class="player">
        <span class="page-count" id="page-count">01 / 18</span>
        <div class="progress" aria-hidden="true"><span id="progress-fill"></span></div>
        <div class="player-actions">
          <button class="icon-button" id="overview-open" type="button" aria-label="页码概览" data-tip="概览"><svg><use href="#grid"/></svg></button>
          <button class="icon-button" id="autoplay" type="button" aria-label="开始自动播放" aria-pressed="false" data-tip="自动播放"><svg><use href="#play"/></svg></button>
          <button class="icon-button" id="fullscreen" type="button" aria-label="进入全屏" data-tip="全屏"><svg><use href="#full"/></svg></button>
          <button class="icon-button help-button" id="help-open" type="button" aria-label="键盘操作帮助" data-tip="帮助">?</button>
          <span class="player-divider" aria-hidden="true"></span>
          <button class="icon-button" id="previous" type="button" aria-label="上一页"><svg class="flip"><use href="#arrow"/></svg></button>
          <button class="next-button" id="next" type="button" aria-label="下一页"><svg><use href="#arrow"/></svg></button>
        </div>
      </footer>
    </main>
  </div>
  <dialog id="overview" aria-labelledby="overview-title">
    <div class="dialog-head"><h2 id="overview-title">18 页</h2><button class="icon-button" type="button" data-close="overview" aria-label="关闭概览"><svg><use href="#close"/></svg></button></div>
    <div class="overview-grid" id="overview-grid"></div>
  </dialog>
  <dialog id="help" aria-labelledby="help-title">
    <div class="dialog-head"><h2 id="help-title">键盘</h2><button class="icon-button" type="button" data-close="help" aria-label="关闭帮助"><svg><use href="#close"/></svg></button></div>
    <div class="shortcut-grid"><kbd>←</kbd><kbd>→</kbd><span>翻页</span><kbd>Space</kbd><span>播放 / 暂停</span><kbd>F</kbd><span>全屏</span><kbd>O</kbd><span>概览</span><kbd>Home</kbd><kbd>End</kbd><span>首尾页</span></div>
  </dialog>
  <div class="rotate-hint">横屏观看</div>
  <div class="sr-only" id="announcer" aria-live="polite"></div>
  <script>@@SCRIPT@@</script>
</body>
</html>
